<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dash 2180 — Touch Dashboard</title>
  <link rel="icon" href="/logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/wide.css" />
</head>
<body>
  <!-- Ambient background glow lights -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  <div class="ambient-glow glow-3"></div>

  <div id="appContainer" class="app-container">
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="brand">
        <img src="/logo.png" alt="Dash logo" class="brand-logo" />
        <div class="brand-info">
          <span class="brand-eyebrow">NANO // DASH</span>
          <h1 class="brand-title">Touch 2180×800</h1>
        </div>
      </div>

      <div class="status-cluster">
        <div class="status-badge" id="badgeDisplay">DISPLAY ON</div>
        <div class="status-badge badge-soft" id="badgeMotion">MOTION --</div>
        <div class="status-badge badge-soft" id="badgeSpotify">SPOTIFY --</div>
        <button class="touch-btn btn-manage" id="btnManageWidgets">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          <span>Customize Grid</span>
        </button>
      </div>
    </header>

    <!-- Main Dashboard View -->
    <main id="dashboardView" class="dashboard-view">
      <div id="dashboardGrid" class="dashboard-grid slots-2">
        <!-- Persistent Time & Date Hero Card -->
        <article class="widget-card time-hero-card" id="cardTime" data-app-id="time">
          <div class="card-glow"></div>
          <div class="time-hero-content">
            <div class="time-header-line">
              <span class="time-day" id="heroDay">THURSDAY</span>
              <span class="time-date" id="heroDate">AUG 13, 2026</span>
            </div>
            <div class="time-main-display">
              <span class="time-digits" id="heroTime">14:35</span>
              <span class="time-seconds" id="heroSeconds">:40</span>
            </div>
            <div class="time-footer-meta" id="heroMeta">
              <div class="meta-pill" id="heroWeatherPill">
                <span class="pill-icon">🌤</span>
                <span class="pill-text" id="heroWeatherText">--°F</span>
              </div>
              <div class="meta-pill">
                <span class="pill-icon">⚡</span>
                <span class="pill-text">Live Touch Surface</span>
              </div>
            </div>
          </div>
        </article>

        <!-- Dynamic User App Slots Container -->
        <div id="slotsContainer" class="slots-container">
          <!-- Slots rendered dynamically via JS -->
        </div>
      </div>
    </main>

    <!-- Full Screen App Overlay View -->
    <div id="appOverlayView" class="app-overlay-view hidden">
      <header class="overlay-header">
        <button class="touch-btn btn-back" id="btnBackToDash">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          <span>Back to Dashboard</span>
        </button>
        <div class="overlay-title-group">
          <h2 id="overlayAppTitle">App Title</h2>
          <span class="overlay-subtitle" id="overlayAppSubtitle">Interactive App View</span>
        </div>
        <div class="overlay-header-spacer"></div>
      </header>

      <section id="appOverlayContent" class="overlay-content">
        <!-- Rendered Full Screen App UI -->
      </section>
    </div>

    <!-- Widget Selector Modal -->
    <div id="widgetModal" class="modal-backdrop hidden">
      <div class="modal-card">
        <div class="modal-header">
          <div>
            <h3>Customize Dashboard</h3>
            <p>Pick up to 3 apps to feature alongside Time & Date</p>
          </div>
          <button class="modal-close-btn" id="btnCloseModal">✕</button>
        </div>
        <div class="modal-body">
          <div class="widget-picker-grid" id="pickerGrid">
            <!-- App Choices rendered via JS -->
          </div>
        </div>
        <div class="modal-footer">
          <span class="slot-count-indicator" id="slotCountIndicator">0 / 3 apps selected</span>
          <button class="touch-btn btn-primary" id="btnSaveConfig">Save Dashboard Layout</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/wide.js"></script>
</body>
</html>
